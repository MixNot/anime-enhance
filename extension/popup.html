<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Anime Enhance</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="mark">✧</span><div><h1>Anime <span>Enhance</span></h1><p>Улучшение изображения в плеере</p></div></header>

  <footer><span id="gpu"></span><span>v0.2.0</span></footer>
  
  <script src="popup.js"></script>
